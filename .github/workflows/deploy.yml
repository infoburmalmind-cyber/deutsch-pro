name: Deploy Deutsch Pro to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/dist
          cp index.html _site/index.html
          cp manifest.json _site/manifest.json
          cp sw.js _site/sw.js
          cp "Немецкий_с_нуля_офлайн (1).html" "_site/Немецкий_с_нуля_офлайн (1).html"
          cp dist/bundle.js _site/dist/bundle.js
          cp dist/aud.js _site/dist/aud.js
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
